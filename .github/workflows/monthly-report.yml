name: Monthly Financial Report

on:
  workflow_dispatch:  # ידני בלבד — הדו"ח החודשי מופק כעת על ידי shared-brain-app (NAS)

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Hebrew fonts
        run: sudo apt-get install -y fonts-noto fonts-noto-hinted

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      - name: Send monthly report
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          SHAI_PHONE: ${{ secrets.SHAI_PHONE }}
        run: node send-monthly-report.mjs
